<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Hour Radio</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 800px at 50% -10%, #2b1b2e 0%, #14101a 55%, #0b0b10 100%);
    color: #f5f0f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  }
  .logo { font-size: 44px; text-align: center; }
  h1 { text-align: center; font-size: 24px; margin: 8px 0 4px; letter-spacing: 0.2px; }
  p.sub { text-align: center; color: #c9bcd0; font-size: 14px; line-height: 1.5; margin: 0 0 8px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #d9cfe0; margin: 16px 0 6px; }
  input {
    width: 100%; padding: 13px 14px; font-size: 16px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.22); background: rgba(0,0,0,0.38); color: #fff;
  }
  input::placeholder { color: #7d7285; }
  input:focus { outline: 2px solid #f2a7c3; outline-offset: 1px; border-color: transparent; }
  button.go {
    width: 100%; margin-top: 24px; padding: 14px; font-size: 17px; font-weight: 700;
    border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, #f2a7c3, #e87fa5); color: #2a1020;
  }
  button.go:disabled { opacity: 0.55; cursor: wait; }
  .err { min-height: 22px; color: #ff9d9d; font-size: 14px; text-align: center; margin-top: 14px; line-height: 1.45; }
  .fine { text-align: center; margin-top: 16px; }
  .fine button {
    background: none; border: none; color: #8f8398; font-size: 12px;
    text-decoration: underline; cursor: pointer; padding: 4px;
  }
  #boot { text-align: center; color: #c9bcd0; font-size: 16px; }
  #boot .logo { margin-bottom: 12px; }
</style>
</head>
<body>
<div class="card" id="gateCard" hidden>
  <div class="logo">🌸</div>
  <h1>Golden Hour Radio</h1>
  <p class="sub">This station is invitation-only.<br>Enter your email and invitation code to tune in.</p>
  <form id="gateForm" autocomplete="off">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
    <label for="code">Invitation code</label>
    <input id="code" name="code" type="text" placeholder="XXXX-XXXX-XXXX"
           required spellcheck="false" autocapitalize="characters" autocomplete="off">
    <button class="go" type="submit" id="goBtn">Tune In</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <div class="fine"><button type="button" id="forgetBtn">Forget this device</button></div>
</div>
<div id="boot"><div class="logo">🌸</div>Tuning in&hellip;</div>

const LS_KEY = "juns-radio-master";
const ITER = 100000;

const te = new TextEncoder();
const td = new TextDecoder();
const b64ToBytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const bytesToB64 = b => btoa(Array.from(b, x => String.fromCharCode(x)).join(""));

async function deriveGuestKey(email, code, saltBytes) {
  const pw = te.encode(email.trim().toLowerCase() + "\n" + code.trim().toUpperCase());
  const base = await crypto.subtle.importKey("raw", pw, "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: saltBytes, iterations: ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}

async function aesGcmDecrypt(key, ivB64, ctB64) {
  const pt = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64ToBytes(ivB64) }, key, b64ToBytes(ctB64));
  return new Uint8Array(pt);
}

/* Try every guest record: only the matching email+code can decrypt one. */
async function tryGuest(email, code) {
  for (const g of GUESTS) {
    try {
      const k = await deriveGuestKey(email, code, b64ToBytes(g.salt));
      const master = await aesGcmDecrypt(k, g.iv, g.ct);
      if (master.length === 32) return master;
    } catch (e) { /* not this record — keep trying */ }
  }
  return null;
}

async function unlockStation(masterBytes) {
  const key = await crypto.subtle.importKey("raw", masterBytes, "AES-GCM", false, ["decrypt"]);
  const html = td.decode(await aesGcmDecrypt(key, STATION.iv, STATION.ct));
  if (!html.includes("<html")) throw new Error("bad payload");
  return html;
}

async function boot(masterB64) {
  const html = await unlockStation(b64ToBytes(masterB64));
  document.open();
  document.write(html);
  document.close();
}

function showGate() {
  document.getElementById("boot").hidden = true;
  document.getElementById("gateCard").hidden = false;
}

(async function init() {
  const saved = localStorage.getItem(LS_KEY);
  if (saved) {
    try { await boot(saved); return; }
    catch (e) { localStorage.removeItem(LS_KEY); }
  }
  showGate();
})();

document.getElementById("gateForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const email = document.getElementById("email").value;
  const code = document.getElementById("code").value;
  const err = document.getElementById("err");
  const btn = document.getElementById("goBtn");
  err.textContent = "";
  btn.disabled = true;
  btn.textContent = "Checking…";
  try {
    const master = await tryGuest(email, code);
    if (!master) {
      err.textContent = "Hmm, that email + code didn't match. Double-check both and try again.";
      return;
    }
    localStorage.setItem(LS_KEY, bytesToB64(master));
    document.getElementById("gateCard").hidden = true;
    document.getElementById("boot").hidden = false;
    await boot(bytesToB64(master));
  } catch (e) {
    err.textContent = "Something hiccupped — try again in a moment.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Tune In";
  }
});

document.getElementById("forgetBtn").addEventListener("click", () => {
  localStorage.removeItem(LS_KEY);
  document.getElementById("email").value = "";
  document.getElementById("code").value = "";
  document.getElementById("err").textContent = "This device forgot you — enter your code again next visit.";
  document.getElementById("email").focus();
});
</script>
